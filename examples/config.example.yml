# Two ways to configure dsh-labscript in a DSH profile.
#
# 1) Hardware-free development / examples (built-in simulator):
- id: dsh-labscript
  name: dsh-labscript
  config:
    python: /path/to/python3
    backend: mock-labscript
    protocolsDir: /path/to/your/protocols
    mock:
      stateDir: ~/.dsh-labscript/mock
    postprocess:
      entry: postprocess_demo:analyze
      pythonPaths: [/path/to/dsh-labscript/examples]

# 2) Real labscript-suite (adjust host/port to your runmanager):
# - id: dsh-labscript
#   name: dsh-labscript
#   config:
#     python: /path/to/labscript-suite/python
#     backend: labscript
#     # runmanager 可以不写：host/port/timeout 默认读 labscript 的 labconfig
#     # （[servers]/[ports]/[timeouts]，端口默认 42523、超时默认 60 s），填了才覆盖。
#     # runmanager: { host: 127.0.0.1, port: 42523, timeoutS: 10 }
#     protocolsDir: /path/to/your/protocols
#     scriptsFile: /path/to/scripts.json
#     hardLimitsFile: /path/to/hard_limits.json
#     calibrationLog: /path/to/calibration.jsonl
#     pathMap:
#       - { remotePrefix: "E:/Experiments", localPrefix: "//lab-pc/Experiments" }
